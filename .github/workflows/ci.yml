name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.4.4
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Biome
        run: bun run check
      - name: Workspace and consumer types
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: API and browser-safe client builds
        run: bun run build
